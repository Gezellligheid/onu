<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNO Online</title>
    <meta name="description" content="Real-time multiplayer UNO — create a room, share the code, and play with friends." />
    <!-- Static site-wide preview (see scripts/og-image-svg.mjs / generate-default-og.mjs)
    used for every page, room links included — no per-room invite code baked
    in, since that would need a server-side render this app doesn't have. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UNO Online" />
    <meta property="og:title" content="UNO Online" />
    <meta property="og:description" content="Real-time multiplayer UNO — create a room, share the code, and play with friends." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UNO Online" />
    <meta name="twitter:description" content="Real-time multiplayer UNO — create a room, share the code, and play with friends." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-950">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
